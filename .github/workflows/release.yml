name: Release HDF5-Manager

on:
  push:
    tags:
      - 'v*'

# A second tag push must not cancel a release that is already compiling.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'
  # Identifier used for macOS code signing (ad-hoc by default).
  BUNDLE_ID: 'com.csic.nanomol.hdf5manager'

jobs:
  verify-version:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Compare tag with pyproject.toml and __init__.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject_version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          module_version="$(grep -m1 '^__version__' src/hdf5_manager/__init__.py | cut -d'"' -f2)"
          echo "tag=${tag} pyproject=${pyproject_version} module=${module_version}"
          if [ "${tag}" != "${pyproject_version}" ] || [ "${tag}" != "${module_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml (${pyproject_version}) or __version__ (${module_version})."
            exit 1
          fi

  build-windows-exe:
    name: Build Windows executable
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller "nicegui[pack]"

      - name: Build EXE
        run: nicegui-pack --onefile --clean --noconfirm --name "HDF5-Manager" --icon src/hdf5_manager/icon.ico packaged_main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdf5-manager-windows-exe
          path: dist/HDF5-Manager.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS DMG (arm64)
    needs: verify-version
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller "nicegui[pack]"

      - name: Build app bundle
        run: nicegui-pack --onefile --windowed --clean --noconfirm --name "HDF5-Manager" --osx-bundle-identifier "$BUNDLE_ID" --icon src/hdf5_manager/icon.icns packaged_main.py

      - name: Verify architecture and signature
        run: |
          set -euo pipefail
          app="dist/HDF5-Manager.app"
          test -d "${app}" || { echo "::error::${app} was not created"; exit 1; }
          file "${app}/Contents/MacOS/HDF5-Manager"
          archs="$(lipo -archs "${app}/Contents/MacOS/HDF5-Manager")"
          echo "architectures: ${archs}"
          case "${archs}" in
            *arm64*) : ;;
            *) echo "::error::expected an arm64 binary, got ${archs}"; exit 1 ;;
          esac
          # PyInstaller ad-hoc signs the bundle; report but do not fail on it.
          codesign --verify --deep --strict --verbose=2 "${app}" \
            || echo "::warning::ad-hoc signature verification reported problems"

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          hdiutil create -volname "HDF5-Manager" -srcfolder "dist/HDF5-Manager.app" -ov -format UDZO "dist/HDF5-Manager-arm64.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdf5-manager-macos-arm64
          path: dist/HDF5-Manager-arm64.dmg
          if-no-files-found: error

  build-macos-x86_64:
    name: Build macOS DMG (x86_64)
    # macos-13 was retired on 2025-12-04: jobs keep queuing forever instead of
    # failing. macos-15-intel is the current (and last) Intel image.
    needs: verify-version
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller "nicegui[pack]"

      - name: Build app bundle
        run: nicegui-pack --onefile --windowed --clean --noconfirm --name "HDF5-Manager" --osx-bundle-identifier "$BUNDLE_ID" --icon src/hdf5_manager/icon.icns packaged_main.py

      - name: Verify architecture and signature
        run: |
          set -euo pipefail
          app="dist/HDF5-Manager.app"
          test -d "${app}" || { echo "::error::${app} was not created"; exit 1; }
          file "${app}/Contents/MacOS/HDF5-Manager"
          archs="$(lipo -archs "${app}/Contents/MacOS/HDF5-Manager")"
          echo "architectures: ${archs}"
          case "${archs}" in
            *x86_64*) : ;;
            *) echo "::error::expected an x86_64 binary, got ${archs}"; exit 1 ;;
          esac
          codesign --verify --deep --strict --verbose=2 "${app}" \
            || echo "::warning::ad-hoc signature verification reported problems"

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          hdiutil create -volname "HDF5-Manager" -srcfolder "dist/HDF5-Manager.app" -ov -format UDZO "dist/HDF5-Manager-x86_64.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdf5-manager-macos-x86_64
          path: dist/HDF5-Manager-x86_64.dmg
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    # Deliberately independent from create-github-release: a PyPI hiccup must
    # not prevent the pre-built binaries from being published.
    needs: verify-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install build

      - name: Build package (sdist and wheel)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  create-github-release:
    name: Create GitHub Release
    needs: [build-windows-exe, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Windows EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: hdf5-manager-windows-exe
          path: ./dist

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: hdf5-manager-macos-arm64
          path: ./dist

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: hdf5-manager-macos-x86_64
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/HDF5-Manager.exe
            ./dist/HDF5-Manager-arm64.dmg
            ./dist/HDF5-Manager-x86_64.dmg
          generate_release_notes: true
